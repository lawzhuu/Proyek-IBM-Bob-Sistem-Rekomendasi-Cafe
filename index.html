<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CaféFind – Sistem Rekomendasi Cafe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fdf8f3;
      --card: #ffffff;
      --border: #e8ddd0;
      --text: #2c1a0e;
      --muted: #7a6552;
      --accent: #c47c3e;
      --accent2: #6b4226;
      --green: #2d7a50;
      --red: #c0392b;
      --yellow: #e6a817;
      --tag-bg: #f5ede3;
      --shadow: 0 2px 12px rgba(44,26,14,0.08);
      --radius: 14px;
    }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, var(--accent2) 0%, var(--accent) 100%);
      color: #fff;
      padding: 28px 24px 24px;
      text-align: center;
    }
    header h1 { font-size: 2rem; letter-spacing: -0.5px; }
    header p  { opacity: .85; margin-top: 4px; font-size: .95rem; }

    /* ── CONTROLS ── */
    .controls {
      max-width: 960px;
      margin: 24px auto 0;
      padding: 0 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .search-wrap {
      flex: 1 1 260px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border: 1.5px solid var(--border);
      border-radius: 50px;
      font-size: .95rem;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap svg {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      opacity: .5;
    }

    select, button {
      padding: 11px 18px;
      border-radius: 50px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: .9rem;
      cursor: pointer;
      outline: none;
      transition: border-color .2s, background .2s;
    }
    select:focus, button:focus { border-color: var(--accent); }

    .btn-location {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .btn-location:hover { background: var(--accent2); border-color: var(--accent2); }

    .btn-reset {
      background: transparent;
      color: var(--muted);
      font-size: .85rem;
    }
    .btn-reset:hover { color: var(--red); border-color: var(--red); }

    /* ── LOCATION BANNER ── */
    #location-banner {
      max-width: 960px;
      margin: 14px auto 0;
      padding: 0 16px;
      display: none;
    }
    #location-banner .banner-inner {
      background: #e8f5ee;
      border: 1.5px solid #a8d5b5;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: .88rem;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── SECTION TITLE ── */
    .section-title {
      max-width: 960px;
      margin: 28px auto 0;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-title h2 { font-size: 1.1rem; color: var(--text); }
    .count-badge {
      background: var(--tag-bg);
      color: var(--accent2);
      font-size: .8rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 50px;
    }

    /* ── GRID ── */
    .grid {
      max-width: 960px;
      margin: 16px auto 40px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
      gap: 20px;
    }

    /* ── CARD ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform .18s, box-shadow .18s;
      cursor: pointer;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(44,26,14,0.13); }

    .card-img {
      width: 100%; height: 160px;
      object-fit: cover;
      display: block;
      background: #e8ddd0;
      position: relative;
    }
    .card-img-placeholder {
      width: 100%; height: 160px;
      background: linear-gradient(135deg, #e8ddd0, #f5ede3);
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
    }

    .badge-distance {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: .75rem;
      padding: 3px 9px;
      border-radius: 50px;
      backdrop-filter: blur(4px);
    }

    .card-body { padding: 14px 16px 16px; }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .card-name { font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.3; }

    .rating {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: .88rem;
      font-weight: 700;
      color: var(--yellow);
      white-space: nowrap;
    }
    .rating span { color: var(--muted); font-weight: 400; font-size: .78rem; }

    .card-location {
      font-size: .82rem;
      color: var(--muted);
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }
    .tag {
      background: var(--tag-bg);
      color: var(--accent2);
      font-size: .75rem;
      padding: 3px 9px;
      border-radius: 50px;
      font-weight: 500;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: .8rem;
      color: var(--muted);
    }
    .open-status { font-weight: 600; }
    .open-status.open { color: var(--green); }
    .open-status.closed { color: var(--red); }

    .price-range { font-size: .82rem; }

    /* ── RECOMMENDED SECTION ── */
    .rec-section {
      max-width: 960px;
      margin: 0 auto 8px;
      padding: 0 16px;
    }
    .rec-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .rec-header h2 { font-size: 1.1rem; }
    .rec-badge {
      background: var(--accent);
      color: #fff;
      font-size: .72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 50px;
      letter-spacing: .5px;
    }

    .rec-grid {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
    }
    .rec-card {
      min-width: 200px;
      background: #fff;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      padding: 14px;
      flex-shrink: 0;
      box-shadow: var(--shadow);
    }
    .rec-card .cafe-emoji { font-size: 2rem; margin-bottom: 6px; }
    .rec-card .rec-name { font-weight: 700; font-size: .92rem; margin-bottom: 4px; }
    .rec-card .rec-dist { font-size: .78rem; color: var(--muted); }
    .rec-card .rec-rating { font-size: .82rem; color: var(--yellow); font-weight: 700; margin-top: 6px; }

    /* ── EMPTY STATE ── */
    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty p { font-size: 1rem; }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #fff;
      border-radius: 18px;
      max-width: 480px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } }
    .modal-img-area {
      height: 180px;
      background: linear-gradient(135deg, #e8ddd0, #f5ede3);
      display: flex; align-items: center; justify-content: center;
      font-size: 5rem;
    }
    .modal-body { padding: 22px 24px 26px; }
    .modal-name { font-size: 1.4rem; font-weight: 700; }
    .modal-sub { color: var(--muted); font-size: .88rem; margin-top: 4px; }
    .modal-rating { margin-top: 10px; font-size: 1rem; color: var(--yellow); font-weight: 700; }
    .modal-divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .modal-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: .9rem; }
    .modal-row .label { color: var(--muted); min-width: 110px; }
    .modal-row .value { font-weight: 500; }
    .modal-desc { font-size: .88rem; color: var(--muted); line-height: 1.6; margin-top: 10px; }
    .modal-close {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-close:hover { background: var(--accent2); }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 24px;
      font-size: .8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    /* ── AI CHAT ── */
    .chat-fab {
      position: fixed;
      bottom: 28px; right: 28px;
      width: 58px; height: 58px;
      border-radius: 50%;
      background: var(--accent2);
      color: #fff;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(107,66,38,.45);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      z-index: 200;
      transition: transform .18s, background .18s;
    }
    .chat-fab:hover { background: var(--accent); transform: scale(1.08); }

    .chat-panel {
      position: fixed;
      bottom: 98px; right: 28px;
      width: 360px; max-width: calc(100vw - 40px);
      height: 520px; max-height: calc(100vh - 130px);
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 12px 48px rgba(44,26,14,.2);
      display: flex; flex-direction: column;
      z-index: 199;
      overflow: hidden;
      border: 1.5px solid var(--border);
      transform: translateY(20px) scale(.97);
      opacity: 0;
      pointer-events: none;
      transition: transform .22s, opacity .22s;
    }
    .chat-panel.open {
      transform: translateY(0) scale(1);
      opacity: 1;
      pointer-events: all;
    }

    .chat-header {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: #fff;
      padding: 14px 18px;
      display: flex; align-items: center; gap: 10px;
    }
    .chat-header .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    .chat-header-info .title { font-weight: 700; font-size: .95rem; }
    .chat-header-info .sub { font-size: .75rem; opacity: .85; }
    .chat-close-btn {
      margin-left: auto;
      background: none; border: none; color: #fff;
      cursor: pointer; font-size: 1.2rem; line-height: 1;
      padding: 0 2px;
    }

    .chat-messages {
      flex: 1; overflow-y: auto;
      padding: 14px 14px 8px;
      display: flex; flex-direction: column; gap: 10px;
      scrollbar-width: thin;
    }

    .msg {
      max-width: 88%;
      padding: 10px 13px;
      border-radius: 14px;
      font-size: .86rem;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg.bot {
      background: #f5ede3;
      color: var(--text);
      border-bottom-left-radius: 4px;
      align-self: flex-start;
    }
    .msg.user {
      background: var(--accent2);
      color: #fff;
      border-bottom-right-radius: 4px;
      align-self: flex-end;
    }
    .msg.typing {
      background: #f5ede3;
      align-self: flex-start;
      color: var(--muted);
      font-style: italic;
    }

    .chat-suggestions {
      padding: 6px 14px 0;
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .chip {
      background: var(--tag-bg);
      color: var(--accent2);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 5px 12px;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .chip:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .chat-input-row {
      padding: 10px 14px 14px;
      display: flex; gap: 8px;
    }
    .chat-input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 50px;
      font-size: .88rem;
      outline: none;
      color: var(--text);
    }
    .chat-input-row input:focus { border-color: var(--accent); }
    .chat-send-btn {
      width: 40px; height: 40px;
      background: var(--accent2);
      color: #fff;
      border: none; border-radius: 50%;
      cursor: pointer; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
      flex-shrink: 0;
    }
    .chat-send-btn:hover { background: var(--accent); }

    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      .controls { gap: 8px; }
      .chat-panel { width: calc(100vw - 24px); right: 12px; bottom: 88px; }
      .chat-fab { bottom: 18px; right: 18px; }
    }
  </style>
</head>
<body>

<!-- ══ HEADER ══ -->
<header>
  <h1>☕ CaféFind</h1>
  <p>Temukan cafe terbaik di sekitar kamu</p>
</header>

<!-- ══ CONTROLS ══ -->
<div class="controls">
  <!-- Search -->
  <div class="search-wrap">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>

    <input type="text" id="searchInput" placeholder="Cari nama cafe, lokasi, atau kategori…" />

  <!-- Sort -->
  <select id="sortSelect">
    <option value="default">Urutkan: Default</option>
    <option value="rating-desc">⭐ Rating Tertinggi</option>
    <option value="rating-asc">Rating Terendah</option>

    <option value="name-asc">A → Z</option>
    <option value="name-desc">Z → A</option>

  <!-- Category filter -->
  <select id="categorySelect">
    <option value="all">Semua Kategori</option>
    <option value="Open 24 Hours">🕛 Buka 24 Jam</option>
    <option value="Open Late">🌙 Open Late</option>
    <option value="Work-Friendly">💻 Work-Friendly</option>
    <option value="Specialty Coffee">☕ Specialty Coffee</option>
    <option value="Outdoor">🌿 Outdoor / Garden</option>
    <option value="Eatery">🍽️ Eatery</option>
    <option value="Hangout Spot">🎉 Hangout Spot</option>

    <option value="Cozy">🛋️ Cozy</option>

  <!-- Status filter -->
  <select id="statusSelect">

  </select>

  <!-- Wilayah filter -->
  <select id="wilayahSelect">
    <option value="all">Semua Wilayah</option>
    <option value="Kota Yogyakarta">🏙️ Kota Yogyakarta</option>
    <option value="Sleman">🌄 Sleman</option>
    <option value="Bantul">🌾 Bantul</option>

  <!-- Detect location -->
  <button class="btn-location" id="btnLocation">

      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>

    Lokasi Saya

</div>

<!-- ══ LOCATION BANNER ══ -->
<div id="location-banner">
  <div class="banner-inner">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
    </svg>
    <span id="locationText">Lokasi terdeteksi</span>
  </div>
</div>

<!-- ══ RECOMMENDED (muncul saat lokasi aktif) ══ -->
<div class="rec-section" id="recSection" style="display:none; margin-top:28px;">
  <div class="rec-header">
    <h2>🎯 Rekomendasi Terdekat</h2>
    <span class="rec-badge">NEARBY TOP PICKS</span>
  </div>
  <div class="rec-grid" id="recGrid"></div>
</div>

<!-- ══ SECTION TITLE ══ -->
<div class="section-title">
  <h2 id="gridTitle">Semua Cafe</h2>
  <span class="count-badge" id="countBadge">0 cafe</span>
</div>

<!-- ══ GRID ══ -->
<div class="grid" id="cafeGrid"></div>

<!-- ══ MODAL ══ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-img-area" id="modalEmoji">☕</div>
    <div class="modal-body">
      <div class="modal-name" id="modalName"></div>
      <div class="modal-sub" id="modalSub"></div>
      <div class="modal-rating" id="modalRating"></div>
      <hr class="modal-divider"/>
      <div class="modal-row"><span class="label">📍 Lokasi</span><span class="value" id="modalLocation"></span></div>
      <div class="modal-row"><span class="label">🕐 Jam Buka</span><span class="value" id="modalHours"></span></div>
      <div class="modal-row"><span class="label">💰 Harga Rata-rata</span><span class="value" id="modalPrice"></span></div>
      <div class="modal-row"><span class="label">📞 Kontak</span><span class="value" id="modalContact"></span></div>
      <div class="modal-row"><span class="label">🚗 Jarak</span><span class="value" id="modalDistance"></span></div>
      <p class="modal-desc" id="modalDesc"></p>
      <button class="modal-close" id="modalClose">Tutup</button>
    </div>
  </div>
</div>

<!-- ══ FOOTER ══ -->
<footer>© 2025 CaféFind &nbsp;·&nbsp; Sistem Rekomendasi Cafe</footer>

<!-- ══ AI CHAT FAB ══ -->
<button class="chat-fab" id="chatFab" title="Tanya AI Recommender">🤖</button>

<!-- ══ AI CHAT PANEL ══ -->
<div class="chat-panel" id="chatPanel">
  <div class="chat-header">
    <div class="avatar">☕</div>
    <div class="chat-header-info">
      <div class="title">Jogja Cafe Recommender AI</div>
      <div class="sub">Panduan ngopi & nugas di Jogja</div>
    </div>
    <button class="chat-close-btn" id="chatClose">✕</button>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-suggestions" id="chatChips">
    <button class="chip">☕ Nugas 24 jam</button>
    <button class="chip">🌙 Buka malam ini</button>
    <button class="chip">🌿 Outdoor Sleman</button>
    <button class="chip">⭐ Rating tertinggi</button>
    <button class="chip">📍 Di Gejayan</button>
    <button class="chip">🎵 Live music</button>
  </div>
  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="Tanya sesuatu… cth: mau nugas di Seturan" maxlength="200"/>
    <button class="chat-send-btn" id="chatSend">➤</button>
  </div>
</div>

<script>

function calcIsOpen(jamBuka) {
  if (jamBuka === "Buka 24 Jam") return true;
  const now = new Date();
  const h = now.getHours() * 60 + now.getMinutes();
  const part = jamBuka.split(" / ")[0];
  const [openStr, closeStr] = part.split(" - ");
  if (!openStr || !closeStr) return true;
  const toMin = s => { const [hh,mm] = s.trim().split(":").map(Number); return hh*60+(mm||0); };
  const open = toMin(openStr);
  let close = toMin(closeStr);
  if (close < open) close += 24*60;
  const hAdj = close < open && h < open ? h + 24*60 : h;
  return hAdj >= open && hAdj < close;
}

const cafes = [
  {
    id: 1, name: "Nyore Coffee & Space", emoji: "☕",
    location: "Jl. Margo Utomo No.79, Gowongan, Kec. Jetis, Kota Yogyakarta",
    district: "Jetis", wilayah: "Kota Yogyakarta",
    lat: -7.7899, lng: 110.3680,
    rating: 4.7, reviews: 2100,
    categories: ["Coffee & Work Space", "Open Late", "Modern Minimalist", "Work-Friendly"],
    hours: "08:00 - 00:00 / 02:00",
    get isOpen() { return calcIsOpen(this.hours); },
    desc: "Work space kafe modern minimalis yang buka hingga larut malam. Cocok untuk kerja, nongkrong, atau meeting santai.",

let userLat = null, userLng = null;
let currentSearch = "", currentSort = "default", currentCategory = "all", currentStatus = "all", currentWilayah = "all";

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function stars(rating) {
  const full = Math.floor(rating);
  const half = rating % 1 >= 0.5 ? 1 : 0;
  return "★".repeat(full) + (half ? "½" : "") + "☆".repeat(5 - full - half);
}

function distLabel(cafe) {
  if (userLat === null) return "—";
  const d = haversine(userLat, userLng, cafe.lat, cafe.lng);
  return d < 1 ? `${Math.round(d*1000)} m` : `${d.toFixed(1)} km`;
}

function filteredCafes() {
  let list = [...cafes];

  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    list = list.filter(c =>
      c.name.toLowerCase().includes(q) ||
      c.location.toLowerCase().includes(q) ||
      c.categories.some(cat => cat.toLowerCase().includes(q)) ||
      c.district.toLowerCase().includes(q)
    );
  }

  if (currentCategory !== "all") {
    list = list.filter(c => c.categories.includes(currentCategory));
  }

  if (currentWilayah !== "all") {
    list = list.filter(c => c.wilayah === currentWilayah);
  }

  if (currentStatus === "open")   list = list.filter(c => c.isOpen);
  if (currentStatus === "closed") list = list.filter(c => !c.isOpen);

  if (currentSort === "rating-desc") list.sort((a,b) => b.rating - a.rating);
  else if (currentSort === "rating-asc") list.sort((a,b) => a.rating - b.rating);
  else if (currentSort === "distance-asc" && userLat !== null)
    list.sort((a,b) => haversine(userLat,userLng,a.lat,a.lng) - haversine(userLat,userLng,b.lat,b.lng));
  else if (currentSort === "name-asc") list.sort((a,b) => a.name.localeCompare(b.name));
  else if (currentSort === "name-desc") list.sort((a,b) => b.name.localeCompare(a.name));

  return list;
}

function renderCards() {
  const list = filteredCafes();
  const grid = document.getElementById("cafeGrid");
  const badge = document.getElementById("countBadge");
  const title = document.getElementById("gridTitle");

  badge.textContent = `${list.length} cafe`;

  if (currentSearch) title.textContent = `Hasil Pencarian: "${currentSearch}"`;
  else if (currentSort === "rating-desc") title.textContent = "⭐ Rating Tertinggi";
  else if (currentSort === "distance-asc" && userLat !== null) title.textContent = "📍 Terdekat dari Kamu";
  else title.textContent = "Semua Cafe";

  if (list.length === 0) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>Tidak ada cafe yang ditemukan.<br>Coba kata kunci lain.</p></div>`;
    return;
  }

  grid.innerHTML = list.map(c => {
    const dist = distLabel(c);
    const distBadge = dist !== "—" ? `<span class="badge-distance">📍 ${dist}</span>` : "";
    return `
    <div class="card" onclick="openModal(${c.id})">
      <div class="card-img-placeholder" style="position:relative;">
        ${c.emoji}
        ${distBadge}
      </div>
      <div class="card-body">
        <div class="card-header-row">
          <div class="card-name">${c.name}</div>
          <div class="rating">★ ${c.rating.toFixed(1)} <span>(${c.reviews.toLocaleString()})</span></div>
        </div>
        <div class="card-location">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          ${c.district}
        </div>
        <div class="tags">${c.categories.map(t => `<span class="tag">${t}</span>`).join("")}</div>
        <div class="card-footer">
          <span class="open-status ${c.isOpen ? 'open' : 'closed'}">${c.isOpen ? "🟢 Buka" : "🔴 Tutup"}</span>
          <span class="price-range">${c.price}</span>
        </div>
      </div>
    </div>`;
  }).join("");
}

function renderRecommendations() {
  if (userLat === null) return;
  const recSection = document.getElementById("recSection");
  const recGrid = document.getElementById("recGrid");
  recSection.style.display = "block";

  const scored = cafes.map(c => {
    const d = haversine(userLat, userLng, c.lat, c.lng);
    const score = c.rating * 20 - d; 
    return { ...c, dist: d, score };
  });
  scored.sort((a,b) => b.score - a.score);
  const top5 = scored.slice(0, 5);

  recGrid.innerHTML = top5.map(c => `
    <div class="rec-card" onclick="openModal(${c.id})" style="cursor:pointer;">
      <div class="cafe-emoji">${c.emoji}</div>
      <div class="rec-name">${c.name}</div>
      <div class="rec-dist">📍 ${c.dist < 1 ? Math.round(c.dist*1000)+' m' : c.dist.toFixed(1)+' km'} &nbsp;·&nbsp; ${c.district}</div>
      <div class="rec-rating">★ ${c.rating.toFixed(1)} · ${c.isOpen ? '<span style="color:#2d7a50">Buka</span>' : '<span style="color:#c0392b">Tutup</span>'}</div>
    </div>
  `).join("");
}

function openModal(id) {
  const c = cafes.find(x => x.id === id);
  if (!c) return;
  document.getElementById("modalEmoji").textContent = c.emoji;
  document.getElementById("modalName").textContent = c.name;
  document.getElementById("modalSub").textContent = c.categories.join(" · ");
  document.getElementById("modalRating").innerHTML = `★ ${c.rating.toFixed(1)} &nbsp; <span style="color:#57606a;font-weight:400;font-size:.88rem">(${c.reviews.toLocaleString()} ulasan)</span>`;
  document.getElementById("modalLocation").textContent = c.location;
  document.getElementById("modalHours").textContent = c.hours;
  document.getElementById("modalPrice").textContent = c.price || "—";
  document.getElementById("modalContact").textContent = c.contact || "—";
  const dist = distLabel(c);
  document.getElementById("modalDistance").textContent = dist !== "—" ? dist : "Aktifkan lokasi untuk melihat jarak";
  document.getElementById("modalDesc").textContent = c.desc;
  document.getElementById("modalOverlay").classList.add("active");
}

});
document.getElementById("modalOverlay").addEventListener("click", e => {

document.getElementById("btnReset").addEventListener("click", () => {

  document.getElementById("searchInput").value = "";
  document.getElementById("sortSelect").value = "default";

document.getElementById("btnLocation").addEventListener("click", () => {
  if (!navigator.geolocation) {
    alert("Browser kamu tidak mendukung geolocation.");
    return;
  }
  const btn = document.getElementById("btnLocation");
  btn.textContent = "Mendeteksi…";
  btn.disabled = true;

  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;

    const banner = document.getElementById("location-banner");
    banner.style.display = "block";
    document.getElementById("locationText").textContent =
      `Lokasi terdeteksi: ${userLat.toFixed(4)}, ${userLng.toFixed(4)} — jarak cafe dihitung dari titik ini`;

    btn.innerHTML = `✅ Lokasi Aktif`;
    btn.style.background = "#2d7a50";
    btn.style.borderColor = "#2d7a50";
    btn.disabled = false;

    currentSort = "distance-asc";
    document.getElementById("sortSelect").value = "distance-asc";

    renderRecommendations();
    renderCards();
  }, err => {
    alert("Gagal mendapatkan lokasi: " + err.message);
    btn.innerHTML = `📍 Lokasi Saya`;
    btn.disabled = false;
  });
});

renderCards();

const KB = cafes.map(c => ({
  id: c.id,
  name: c.name,
  wilayah: c.wilayah,
  district: c.district,
  rating: c.rating,
  reviews: c.reviews,
  categories: c.categories,
  hours: c.hours,
  isOpen: c.isOpen,
  desc: c.desc,
  emoji: c.emoji,
}));

const INTENT = {
  nugas:    ["nugas", "kerja", "ngerjain", "tugas", "skripsi", "deadline", "coworking", "co-working", "work", "belajar", "wifi", "internet", "laptop"],
  latenight:["malam", "malem", "larut", "dini hari", "subuh", "24 jam", "24jam", "open late", "tengah malam"],
  open24:   ["24 jam", "24jam", "semalam", "kapan aja", "24 hours", "tidak tutup", "ga tutup"],
  outdoor:  ["outdoor", "terbuka", "alam", "garden", "kebun", "sawah", "alam terbuka", "luar"],
  aesthetic:["estetik", "aesthetic", "foto", "fotografi", "instagram", "instagrammable", "cantik", "bagus"],
  cozy:     ["cozy", "nyaman", "tenang", "kalem", "santai", "quiet", "sepi", "baca buku"],
  eatery:   ["makan", "eatery", "makanan", "lapar", "food", "menu"],
  livemusic:["live music", "musik", "band", "konser", "hiburan"],
  specialty:["specialty", "single origin", "roastery", "brew", "pour over", "kopi serius", "kopi bagus", "kopi enak"],
  affordable:["murah", "terjangkau", "hemat", "ekonomis", "budget", "kantong", "mahasiswa"],
  rooftop:  ["rooftop", "atap", "atas", "pemandangan", "view"],
  family:   ["keluarga", "family", "anak", "bareng keluarga"],
};

const AREA = {
  "Kota Yogyakarta": ["kota jogja","kota yogya","kota yogyakarta","jogja kota","pusat kota","kota"],
  "Sleman":          ["sleman","seturan","gejayan","jakal","kaliurang","palagan","condongcatur","mlati","ngaglik","depok"],
  "Bantul":          ["bantul","kasihan","tirtonirmolo"],
  "Seturan":         ["seturan"],
  "Gejayan":         ["gejayan","affandi"],
  "Kaliurang":       ["kaliurang","jakal"],
  "Palagan":         ["palagan"],
  "Tirtodipuran":    ["tirtodipuran"],
  "Prawirotaman":    ["prawirotaman"],
  "Kotabaru":        ["kotabaru"],
  "Gondokusuman":    ["gondokusuman","demangan"],
  "Mantrijeron":     ["mantrijeron"],
};

const CAT_MAP = {
  nugas:    ["Work-Friendly","Co-working Space","Coworking Space","Nugas Friendly","Fast Internet","High Speed WiFi","Coffee & Work Space","Spacious Coworking","Student Space","Student Hub","Book Cafe","Quiet Vibes"],
  latenight:["Open Late","Open 24 Hours"],
  open24:   ["Open 24 Hours"],
  outdoor:  ["Outdoor","Outdoor Garden","Garden Cafe","Rice Field View","Spacious Outdoor","Biophilic Greenery","Plant Shop Cafe"],
  aesthetic:["Aesthetic","Aesthetic Architecture","Aesthetic Brunch","Modern Minimalist","Minimalist","Rooftop View","Heritage Building"],
  cozy:     ["Cozy","Cozy Coffee","Cozy Space","Calm Vibe","Quiet Vibes","Book Cafe"],
  eatery:   ["Eatery","Casual Dining","Lounge & Eatery","Large Capacity"],
  livemusic:["Live Music"],
  specialty:["Specialty Coffee","Specialty Roastery","Coffee Roastery","Coffee Roaster","Specialty Beans","Artisan Coffee","Slow Bar"],
  affordable:["Affordable Coffee","Pocket Friendly","Student Hub"],
  rooftop:  ["Rooftop View"],
  family:   ["Family Friendly"],
};

function detectIntents(msg) {
  const m = msg.toLowerCase();
  const found = [];
  for (const [intent, words] of Object.entries(INTENT)) {
    if (words.some(w => m.includes(w))) found.push(intent);
  }
  return found;
}

function detectArea(msg) {
  const m = msg.toLowerCase();
  for (const [area, words] of Object.entries(AREA)) {
    if (words.some(w => m.includes(w))) return area;
  }
  return null;
}

function scoreCafe(cafe, intents, area) {
  let score = cafe.rating * 10;

  if (area) {
    const areaLower = area.toLowerCase();
    const inWilayah = cafe.wilayah.toLowerCase().includes(areaLower);
    const inDistrict = cafe.district.toLowerCase().includes(areaLower);
    const inLocation = cafe.location.toLowerCase().includes(areaLower);
    
    const subWords = AREA[area] || [];
    const inSub = subWords.some(w => cafe.location.toLowerCase().includes(w) || cafe.district.toLowerCase().includes(w));

    if (inWilayah || inDistrict || inLocation || inSub) score += 50;
    else return -1; 
  }

  for (const intent of intents) {
    const cats = CAT_MAP[intent] || [];
    const matches = cats.filter(cat => cafe.categories.includes(cat)).length;
    score += matches * 15;
  }

  if (cafe.isOpen) score += 5;

  return score;
}

function buildRecoCard(cafe, rank) {
  return `<strong>${rank}. ${cafe.emoji} ${cafe.name}</strong> (⭐ ${cafe.rating.toFixed(1)}/5.0)\n` +
    `📍 <strong>Wilayah:</strong> ${cafe.wilayah} (${cafe.district})\n` +
    `🕒 <strong>Jam Buka:</strong> ${cafe.hours}\n` +
    `🏷️ <strong>Vibe:</strong> ${cafe.categories.slice(0,3).join(", ")}\n` +
    `💡 ${cafe.desc}`;
}

function aiRespond(userMsg) {
  const msg = userMsg.trim();
  if (!msg) return null;

  const lower = msg.toLowerCase();

  const jogjaKeywords = ["kafe","cafe","kopi","coffee","nugas","makan","nongkrong","rekomendasi","tempat","jogja","yogya","sleman","bantul","minum","ngopi","coworking","buka","tutup","murah","mahal","wifi","rating","outdoor","aesthetic","cozy","enak","beli","dekat","area","lokasi"];
  const isOnDomain = jogjaKeywords.some(k => lower.includes(k));
  if (!isOnDomain) {
    return `Hehe, aku cuma bisa bantu soal rekomendasi kafe di Jogja nih! 😄\n\nCoba tanya sesuatu seperti:\n• "Kafe nugas 24 jam di Seturan"\n• "Tempat nongkrong malam di Kota Jogja"\n• "Kafe outdoor di Sleman yang aesthetic"\n\nAda yang mau dicari di Jogja? ☕`;
  }

  const intents = detectIntents(msg);
  const area = detectArea(msg);

  let candidates = KB
    .map(c => ({ ...c, score: scoreCafe(c, intents, area) }))
    .filter(c => c.score > 0)
    .sort((a, b) => b.score - a.score);

  if (candidates.length === 0) {
    candidates = [...KB].sort((a,b) => b.rating - a.rating);
  }

  const top = candidates.slice(0, 3);

  let intro = "Halo! Ini beberapa rekomendasi kafe di Jogja yang paling cocok buat kebutuhanmu:\n\n";

  if (area && intents.length) {
    const intentLabels = { nugas:"nugas/kerja", latenight:"buka malam/dini hari", open24:"buka 24 jam", outdoor:"outdoor", aesthetic:"aesthetic", cozy:"cozy & tenang", eatery:"makan", livemusic:"live music", specialty:"specialty coffee", affordable:"harga terjangkau", rooftop:"rooftop view", family:"keluarga" };
    const labelArr = intents.map(i => intentLabels[i]).filter(Boolean);
    intro = `Oke, aku cariin kafe ${labelArr.length ? labelArr.join(" & ") + " " : ""}di area <strong>${area}</strong> ya! Ini pilihannya:\n\n`;
  } else if (area) {
    intro = `Ini rekomendasi kafe terbaik di area <strong>${area}</strong>:\n\n`;
  } else if (intents.length) {
    const intentLabels = { nugas:"nugas/kerja", latenight:"buka malam", open24:"buka 24 jam", outdoor:"outdoor", aesthetic:"aesthetic", cozy:"cozy", eatery:"makan-makan", livemusic:"live music", specialty:"specialty coffee", affordable:"budget-friendly", rooftop:"rooftop", family:"bareng keluarga" };
    const labelArr = intents.map(i => intentLabels[i]).filter(Boolean);
    intro = `Dicari kafe buat <strong>${labelArr.join(" & ")}</strong>? Ini yang paling cucok:\n\n`;
  }

  const cards = top.map((c, i) => buildRecoCard(c, i + 1)).join("\n\n");

  const closings = [
    "Mau cari di area lain atau butuh yang suasananya lebih tenang? Kasih tahu aja ya! 🙌",
    "Ada preferensi lain, kayak yang lebih murah atau ada parkir motor? Tinggal bilang! 😄",
    "Mau yang buka lebih lama atau yang punya indoor nyaman? Aku siap bantuin! ☕",
    "Kalau mau yang lebih spesifik — misal rating 5.0 doang atau yang 24 jam — tanya aja ya!",
  ];
  const closing = "\n\n" + closings[Math.floor(Math.random() * closings.length)];

  return intro + cards + closing;
}

const chatMessages = document.getElementById("chatMessages");

function appendMsg(text, type) {
  const div = document.createElement("div");
  div.className = `msg ${type}`;
  if (type === "bot") {
    div.innerHTML = text
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
      .replace(/<strong>/g,"<strong>").replace(/<\/strong>/g,"</strong>")
      .replace(/&lt;strong&gt;/g,"<strong>").replace(/&lt;\/strong&gt;/g,"</strong>")
      .replace(/\n/g,"<br>");
  } else {
    div.textContent = text;
  }
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

function sendMessage(text) {
  const trimmed = text.trim();
  if (!trimmed) return;

  document.getElementById("chatChips").style.display = "none";

  appendMsg(trimmed, "user");
  document.getElementById("chatInput").value = "";

  const typing = appendMsg("Lagi mikir… ✍️", "typing");

  setTimeout(() => {
    typing.remove();
    const reply = aiRespond(trimmed);
    if (reply) appendMsg(reply, "bot");
  }, 600 + Math.random() * 400);
}

const chatFab   = document.getElementById("chatFab");
const chatPanel = document.getElementById("chatPanel");
const chatClose = document.getElementById("chatClose");
const chatInput = document.getElementById("chatInput");
const chatSend  = document.getElementById("chatSend");

chatFab.addEventListener("click", () => {

    setTimeout(() => {
      appendMsg("Halo! 👋 Aku <strong>Jogja Cafe Recommender AI</strong>.\n\nMau cari kafe buat nugas, nongkrong, atau ngopi di Jogja? Tinggal tanya aja, aku siap bantu! ☕\n\nContoh: <em>\"Kafe nugas 24 jam di Seturan\"</em> atau <em>\"Cafe outdoor aesthetic di Sleman\"</em>", "bot");
    }, 200);
  }
});

chatClose.addEventListener("click", () => {
  chatPanel.classList.remove("open");
  chatFab.style.display = "flex";
});

chatSend.addEventListener("click", () => sendMessage(chatInput.value));
chatInput.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(chatInput.value); });

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => sendMessage(chip.textContent.replace(/^[^\w]+/,"").trim()));
});
